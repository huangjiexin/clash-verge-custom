name: Custom Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HUSKY: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          key: custom-windows-x64
      - name: Prepare resources
        run: |
          pnpm install --frozen-lockfile
          pnpm prebuild x86_64-pc-windows-msvc
      - name: Build unsigned installer
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 custom-bundle.json
          pnpm exec tauri build --target x86_64-pc-windows-msvc --config custom-bundle.json -- --profile fast-release
      - name: Hash installer
        shell: pwsh
        run: |
          Get-ChildItem target/x86_64-pc-windows-msvc/fast-release/bundle/nsis/*setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: clash-verge-custom-windows-x64
          path: target/x86_64-pc-windows-msvc/fast-release/bundle/nsis/*setup.exe*
          if-no-files-found: error
          retention-days: 30
